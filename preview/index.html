<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design preview: The Reclamation Daily</title>
<style>
  /* v12: the magazine cover. Unbiased reports, presented with 1980s-2000s newsstand energy.
     Ground: deep saturated colour (never white). Cover: full-bleed photo, huge masthead, Rivet as the cover star.
     Reports: facts first, then where the sources differ. Opinion and fun live OFF THE RECORD, in their own band. */
  @font-face { font-family: 'Archivo Black'; font-weight: 400; font-display: swap; src: url(fonts/ArchivoBlack-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 400 700; font-display: swap; src: url(fonts/Jost-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(fonts/IBMPlexMono-normal-500.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-display: swap; src: url(fonts/IBMPlexMono-normal-700.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-weight: 400 600; font-display: swap; src: url(fonts/Newsreader-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/Newsreader-italic-400.woff2) format('woff2'); }

  :root {
    --ink: #100D09; --ink2: #1B1712; --cream: #F6F0DE; --dim: rgba(246,240,222,.72); --line: rgba(246,240,222,.2);
    --brass: #F0CD7A; --hot: #FF5C00; --red: #ED1C24;
    /* six hues, each in three tones: g = deep ground (cream text >= 7:1), c = the saturated slab colour, l = light tone for text on ink (>= 4.5:1) */
    --g1: #14237E; --c1: #2350FF; --l1: #8FA8FF;
    --g2: #124834; --c2: #2F7D5B; --l2: #63D6A0;
    --g3: #5C4300; --c3: #A67600; --l3: #F2C94C;
    --g4: #5A1020; --c4: #8C2331; --l4: #FF9AA8;
    --g5: #0D4457; --c5: #1D6F8C; --l5: #62CFEA;
    --g6: #61183E; --c6: #B23A6D; --l6: #F49AC8;
    --fs: 17px; --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --ui: "Jost", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ink); color: var(--cream); font: 400 var(--fs)/1.65 var(--ui); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; border-radius: 2px; }
  .mono { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .prog { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--brass); z-index: 90; }

  .winbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 95; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; cursor: grab; background: var(--ink); color: var(--cream); }
  .native .winbar { display: flex; } .winbar .wl { font: 500 10px var(--mono); letter-spacing: .22em; }
  .winbar button { background: none; box-shadow: none; color: var(--cream); min-height: 24px; padding: 0 8px; }

  /* ---- controls: glossy keys that press ---- */
  .btn, button, select { font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: linear-gradient(180deg, #fff6d6, var(--brass) 55%, #d9b155); border: 0; border-radius: 99px; padding: 0 16px; min-height: 36px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 3px 0 #8a6a1f, 0 6px 12px rgba(0,0,0,.35); transition: transform .1s ease-out, box-shadow .16s, filter .16s; }
  select { padding-right: 10px; max-width: 140px; } select option { background: #fff; color: #111; }
  @media (hover: hover) and (pointer: fine) { .btn:hover, button:hover, select:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #8a6a1f, 0 10px 16px rgba(0,0,0,.4); filter: brightness(1.06); text-decoration: none; } }
  .btn:active, button:active { transform: scale(.96) translateY(1px); box-shadow: 0 1px 0 #8a6a1f; }
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 70; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px clamp(14px, 3vw, 40px); background: linear-gradient(180deg, rgba(16,13,9,.7), rgba(16,13,9,0)); transition: background .3s; }
  .top.solid { background: rgba(16,13,9,.94); box-shadow: 0 1px 0 var(--line); }
  .native .top { top: 32px; }
  .top .grow { flex: 1; }

  /* ---- THE COVER ---- */
  .cover { position: relative; isolation: isolate; overflow: hidden; min-height: max(100svh, 720px); display: flex; flex-direction: column; padding: clamp(66px, 8.5vh, 92px) clamp(16px, 4vw, 56px) clamp(16px, 2.4vh, 28px); }
  .cover .bg { position: absolute; inset: 0; z-index: -3; width: 100%; height: 100%; object-fit: cover; animation: settle 1.8s var(--ease) both; }
  .cover::before { content: ""; position: absolute; inset: 0; z-index: -2; background: linear-gradient(180deg, rgba(10,8,5,.66) 0%, rgba(10,8,5,.05) 30%, rgba(10,8,5,.08) 46%, rgba(10,8,5,.9) 100%); }
  .cover::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, color-mix(in srgb, var(--g1) 70%, transparent) 0%, rgba(0,0,0,0) 56%); }
  @keyframes settle { from { transform: scale(1.09); } to { transform: none; } }
  .issue { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--cream); text-shadow: 0 1px 6px rgba(0,0,0,.7); margin-bottom: clamp(6px, 1.4vh, 14px); }
  .mast { position: relative; z-index: 1; margin: 0; line-height: .8; text-transform: uppercase; font-family: var(--display); letter-spacing: -.045em; pointer-events: none; }
  .mast .big { display: block; font-size: 15vw; white-space: nowrap; width: max-content; color: var(--cream);
    filter: drop-shadow(1px 1px 0 #1a2a86) drop-shadow(2px 2px 0 #1a2a86) drop-shadow(3px 3px 0 #1a2a86) drop-shadow(4px 4px 0 #1a2a86) drop-shadow(6px 8px 0 #12185a) drop-shadow(10px 16px 14px rgba(0,0,0,.45)); }
  .mast .big span { display: inline-block; animation: drop .9s var(--spring) both; animation-delay: calc(var(--i) * 38ms + 250ms); }
  .mast .sm { display: inline-block; font-size: clamp(14px, 2.6vw, 34px); letter-spacing: .06em; color: var(--brass); text-shadow: 0 2px 0 rgba(0,0,0,.6); padding: 0 .3em; }
  .mast .sm.r { float: right; }
  @keyframes drop { from { transform: translateY(-70%) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

  .star { position: absolute; z-index: 3; left: min(56vw, 700px); top: clamp(250px, 40vh, 380px); width: clamp(110px, 14vw, 180px); transform: rotate(-9deg); animation: spin 1.1s var(--spring) .9s both; filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)); }
  @keyframes spin { from { transform: rotate(-200deg) scale(.1); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
  .star polygon { fill: var(--brass); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
  .star text { font-family: var(--display); fill: var(--ink); text-anchor: middle; }

  .lines { position: relative; z-index: 2; margin-top: auto; padding-top: 14px; width: min(100%, 540px); display: flex; flex-direction: column; gap: clamp(6px, 1.1vh, 12px); }
  .cl { display: block; position: relative; padding-left: 0; animation: slidein .7s var(--ease) both; animation-delay: calc(var(--i) * 110ms + 700ms); transition: transform .22s var(--ease); }
  @keyframes slidein { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .cl .k { display: inline-block; font: 700 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; padding: 3px 9px 2px; color: var(--ink); background: var(--l); border-radius: 2px; margin-bottom: 5px; }
  .cl b { display: block; font: 400 clamp(16px, min(1.9vw, 3.4svh), 26px)/1.04 var(--display); text-transform: uppercase; letter-spacing: -.02em; color: var(--cream); text-shadow: 2px 2px 0 rgba(0,0,0,.75), 0 0 18px rgba(0,0,0,.5); text-wrap: balance; }
  .cl.lead b { font-size: clamp(28px, min(3.9vw, 6.4svh), 60px); line-height: .96; }
  .cl:nth-child(n+4) { display: none; }
  .cl .n { display: inline-block; margin-top: 4px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brass); text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  @media (hover: hover) and (pointer: fine) { .cl:hover { transform: translateX(6px); text-decoration: none; } }
  .cl:active { transform: scale(.985); }
  .rivet-cover { position: absolute; z-index: 2; right: clamp(-10px, 2vw, 60px); top: clamp(176px, 29svh, 300px); }
  .rivet-cover .rv-svg { height: min(68svh, 600px) !important; width: auto !important; }
  .rivet-cover .rivet { cursor: pointer; filter: drop-shadow(0 18px 20px rgba(0,0,0,.5)); }
  .rivet-cover .rv-bubble { position: absolute !important; left: auto !important; right: 84% !important; top: 16% !important; margin: 0 !important; }
  .credit { position: relative; z-index: 2; margin-top: clamp(10px, 1.8vh, 20px); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--dim); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .credit .tag { color: #1c1d1f; padding: 5px 10px 4px; border-radius: 1px; background: #b7b8b4 url(img/steel-nameplate.webp) center / cover; text-shadow: 0 1px 0 rgba(255,255,255,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(0,0,0,.3); }
  .barcode { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px 4px; background: var(--cream); border-radius: 3px; color: var(--ink); transform: rotate(-2deg); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .barcode svg { display: block; width: 92px; height: 34px; } .barcode span { font: 700 8px var(--mono); letter-spacing: .12em; }
  @media (max-width: 720px) { .barcode { display: none; } }
  .cover.seen *, .cover.seen { animation-duration: .01ms !important; animation-delay: 0ms !important; }

  /* ---- breaking (only when the edition has one): the only place red lives ---- */
  .breaking { background: var(--ink); color: var(--cream); border-top: 8px solid var(--red); }
  .breaking .in { max-width: 1240px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 56px); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .pill { background: var(--red); color: #fff; font: 700 10.5px var(--mono); letter-spacing: .18em; padding: 4px 10px; border-radius: 1px; }
  .breaking .t { font: 600 clamp(17px, 2vw, 22px)/1.3 var(--serif); } .breaking .s { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--dim); margin-left: auto; }

  /* ---- ticker ---- */
  .ticker { background: var(--ink); color: var(--brass); display: flex; align-items: center; overflow: hidden; border-block: 1px solid var(--line); }
  .live { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px 10px clamp(16px, 4vw, 56px); font: 700 10.5px var(--mono); letter-spacing: .2em; color: var(--cream); background: var(--ink); position: relative; z-index: 1; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
  .run { flex: 1; overflow: hidden; }
  .run > div { display: inline-flex; gap: 38px; white-space: nowrap; padding-left: 100%; animation: marq 70s linear infinite; font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .ticker:focus-within .run > div { animation-play-state: paused; }
  @media (hover: hover) and (pointer: fine) { .ticker:hover .run > div { animation-play-state: paused; } }
  .run b { color: var(--cream); font-weight: 700; }
  @keyframes marq { to { transform: translateX(-100%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }

  /* ---- chapter chips (sticky) ---- */
  .chips { position: sticky; top: 60px; z-index: 60; background: rgba(16,13,9,.94); border-bottom: 1px solid var(--line); }
  .native .chips { top: 88px; }
  .chips .track { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px clamp(16px, 4vw, 56px); }
  .chips .track::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 99px; font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cream);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c) 50%, color-mix(in srgb, var(--c) 74%, #000)); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.4); text-shadow: 0 1px 0 rgba(0,0,0,.35); transition: transform .1s ease-out, filter .16s; }
  .chip.on { outline: 2px solid var(--cream); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .chip:hover { transform: translateY(-2px); filter: brightness(1.1); text-decoration: none; } }
  .chip:active { transform: scale(.96); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); }

  /* ---- the promise ---- */
  .promise { background: var(--g1); padding: clamp(48px, 9vh, 96px) 0; }
  .promise .q { font: 700 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--l1); margin-bottom: 14px; }
  .promise h2 { margin: 0; max-width: 20ch; font: 400 clamp(36px, 7vw, 96px)/.92 var(--display); text-transform: uppercase; letter-spacing: -.035em; text-wrap: balance; text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  .promise p { max-width: 58ch; margin: 22px 0 0; font: 400 clamp(18px, 2vw, 22px)/1.55 var(--serif); color: var(--cream); }

  /* ---- the numbers ---- */
  .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; padding: clamp(28px, 5vh, 52px) 0; }
  .num-tile { position: relative; overflow: hidden; padding: 20px 22px 18px; border-radius: 12px; color: var(--cream);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff) 0%, var(--c) 46%, color-mix(in srgb, var(--c) 74%, #000) 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25); }
  .num-tile::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0)); pointer-events: none; }
  .num-tile b { position: relative; display: block; font: 700 clamp(34px, 5vw, 60px)/1 var(--mono); letter-spacing: -.04em; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .num-tile span { position: relative; display: block; margin-top: 6px; font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .rows { padding-bottom: 8px; color: var(--dim); font: 500 12px/1.7 var(--mono); letter-spacing: .05em; text-transform: uppercase; }

  /* ---- TL;DR: the whole record on one screen ---- */
  .tldr { background: var(--ink2); border-block: 1px solid var(--line); padding: 30px 0 34px; }
  .tldr .lbl { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 700 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--brass); padding-bottom: 8px; }
  .lz-g { border-top: 1px solid var(--line); }
  .lz-h { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; transition: transform .22s var(--ease), color .16s; }
  .lz-h span { margin-left: auto; color: var(--dim); font-weight: 500; }
  .lz-h::after, .rep > .h::after, .more-i > .h::after, .mag > .mh::after, .art > .ah::after { content: "+"; flex: none; font: 500 20px/1 var(--mono); transition: transform .26s var(--ease); }
  .open > .lz-h::after, .open > .h::after, .open > .mh::after, .open > .ah::after { transform: rotate(45deg); }
  .lz-i { padding: 8px 0 8px 14px; margin: 4px 0; border-left: 3px solid var(--line); cursor: pointer; transition: border-color .2s, transform .22s var(--ease); }
  @media (hover: hover) and (pointer: fine) { .lz-i:hover { border-left-color: var(--brass); transform: translateX(3px); } .lz-h:hover { color: var(--brass); } }
  .lz-i .t { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .lz-i div { font: 500 16px/1.45 var(--ui); } .lz-i small { display: block; color: var(--dim); font: italic 400 15px var(--serif); margin-top: 2px; }

  .xp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
  .xp > .in { overflow: hidden; min-height: 0; }
  .open > .xp { grid-template-rows: 1fr; }
  .pad { padding: 4px 0 16px 16px; margin-left: 2px; border-left: 3px solid var(--l, var(--brass)); }

  /* ---- chapters: a photo-and-colour cover opener, then the reports on a deep ground ---- */
  [id] { scroll-margin-top: 124px; }
  .sec { background: var(--g); }
  .sh { position: relative; overflow: hidden; min-height: clamp(220px, 36vh, 400px); display: flex; align-items: flex-end; }
  .sh img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .sh::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 94%, transparent) 0%, color-mix(in srgb, var(--c) 66%, transparent) 46%, color-mix(in srgb, var(--c) 6%, transparent) 100%), linear-gradient(0deg, rgba(0,0,0,.5), rgba(0,0,0,0) 55%); }
  .sh .in { position: relative; z-index: 2; width: 100%; max-width: 1240px; margin: 0 auto; padding: clamp(22px, 4vw, 44px) clamp(16px, 4vw, 56px); display: flex; align-items: center; gap: clamp(14px, 3vw, 40px); }
  .sun { position: absolute; z-index: 1; left: 0; top: 50%; width: min(90vw, 760px); aspect-ratio: 1; transform: translate(-14%, -50%); fill: #fff; opacity: .12; pointer-events: none; overflow: visible; }
  .num { flex: none; font: 400 clamp(64px, 12vw, 160px)/.86 var(--display); letter-spacing: -.04em; background: linear-gradient(180deg, #ffffff 0%, #fbf3dc 42%, #e3d5ad 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(1px 1px 0 var(--dk)) drop-shadow(2px 2px 0 var(--dk)) drop-shadow(3px 3px 0 var(--dk)) drop-shadow(4px 4px 0 var(--dk)) drop-shadow(6px 7px 0 var(--dk)) drop-shadow(10px 14px 12px rgba(0,0,0,.4));
    transform-origin: 50% 80%; transition: transform .32s var(--spring); }
  @media (hover: hover) and (pointer: fine) { .sh:hover .num { transform: scale(1.06) rotate(-3deg); } }
  .sh h2 { margin: 0; font: 400 clamp(30px, 6.2vw, 84px)/.94 var(--display); text-transform: uppercase; letter-spacing: -.03em; text-shadow: 3px 3px 0 rgba(0,0,0,.35); text-wrap: balance; }
  .sec-body { max-width: 1240px; margin: 0 auto; padding: clamp(26px, 4vw, 44px) clamp(16px, 4vw, 56px) clamp(38px, 6vw, 64px); }
  .manual { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .oneline { max-width: 34ch; margin: 18px 0 26px; font: 500 clamp(22px, 3.2vw, 38px)/1.2 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
  .oneline b { display: block; font: 700 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--l); margin-bottom: 8px; }
  .reps { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .reps { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }

  /* a report: what is established, then where the sources differ */
  .rep { position: relative; background: var(--ink2); border-radius: 12px; border-top: 6px solid var(--c); box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); transition: transform .22s var(--ease); }
  .rep::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 60px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none; border-radius: 6px 6px 0 0; }
  @media (hover: hover) and (pointer: fine) { .rep:hover { transform: translateY(-3px); } }
  .rep > .h { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 16px; cursor: pointer; }
  .rep > .h h3 { flex: 1; margin: 0; font: 400 clamp(19px, 2.2vw, 25px)/1.12 var(--display); text-transform: uppercase; letter-spacing: -.015em; text-wrap: balance; }
  .cnt { flex: none; font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px 3px; border-radius: 2px; color: var(--ink); background: var(--l); }
  .rep .pad { margin: 0 18px; padding-bottom: 18px; }
  .cmp { font: 700 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--l); margin: 14px 0 6px; }
  .facts { margin: 4px 0 8px; padding-left: 20px; font: 500 16px/1.55 var(--ui); } .facts li { margin: 5px 0; }
  .split { margin: 8px 0; padding: 10px 14px; background: rgba(246,240,222,.08); border-left: 3px solid var(--l); font: 500 15px/1.55 var(--ui); }
  .diff { padding: 6px 0 6px 12px; margin: 4px 0; border-left: 3px solid var(--line); font: 500 15px/1.5 var(--ui); } .diff b { color: var(--l); }
  .src a { display: block; padding: 8px 0; border-top: 1px solid var(--line); font: 500 15px/1.45 var(--ui); } .src small { color: var(--dim); font-weight: 400; }
  .flag { display: inline-block; font: 700 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--dim); color: var(--dim); vertical-align: 1px; }
  .tl { display: none; margin: 8px 0 18px; padding: 12px 16px; background: rgba(246,240,222,.09); border-radius: 6px; font: 500 16px/1.5 var(--ui); max-width: 68ch; }
  .tl.on { display: block; }
  .tl b { font: 700 10px var(--mono); letter-spacing: .16em; margin-right: 8px; color: var(--l, var(--brass)); }
  .tl em { display: block; font: italic 400 15px var(--serif); color: var(--dim); margin-top: 3px; }
  .body p { margin: 0 0 1.1em; max-width: 66ch; font-family: var(--serif); font-size: clamp(17px, 1.3vw, 19px); }
  .art { border-top: 1px solid var(--line); }
  .art > .ah { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 0; cursor: pointer; font: 600 19px/1.3 var(--serif); }
  .lbl { font: 700 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--l, var(--brass)); }
  .note { font: italic 400 16px/1.55 var(--serif); color: var(--dim); margin: 14px 0; max-width: 66ch; }
  .lede { color: var(--dim); font: 400 15px/1.45 var(--ui); margin: 0 0 4px; }
  .by { font: 500 11px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

  /* ---- more pile, mag rack ---- */
  .more-i { border-top: 1px solid var(--line); }
  .more-i > .h { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; min-height: 48px; padding: 10px 2px; cursor: pointer; font: 600 16px/1.35 var(--ui); transition: transform .22s var(--ease), color .16s; }
  .more-i .t { flex: 1; }
  @media (hover: hover) and (pointer: fine) { .more-i > .h:hover, .mag > .mh:hover, .art > .ah:hover { transform: translateY(-2px); color: var(--l, var(--brass)); } }
  .more-i > .h:active, .mag > .mh:active, .art > .ah:active, .lz-h:active { transform: scale(.985); transition-duration: .08s; }
  .mag { border-top: 1px solid var(--line); }
  .mag > .mh { display: flex; align-items: center; gap: 16px; min-height: 80px; cursor: pointer; transition: transform .22s var(--ease), color .16s; }
  .cv { flex: none; width: 50px; height: 66px; display: grid; place-items: center; color: #fff; font: 400 28px var(--display); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 72%, #000)); border-radius: 3px; box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 rgba(0,0,0,.4); }
  .mag .mh b { font: 400 clamp(18px, 2.2vw, 24px) var(--display); text-transform: uppercase; letter-spacing: -.01em; } .mag .mh span.tg { display: block; font: 500 11px var(--mono); letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
  .mag .mh > div { flex: 1; }
  .think { font: italic 400 18px/1.6 var(--serif); border-left: 3px solid var(--l, var(--line)); padding-left: 14px; margin: 10px 0 16px; max-width: 66ch; }
  .letter { padding: 16px 0; border-top: 1px solid var(--line); } .letter .t { font: 500 20px/1.5 var(--serif); max-width: 62ch; } .letter .r { font: italic 400 17px/1.55 var(--serif); color: var(--dim); margin-top: 6px; padding-left: 14px; border-left: 3px solid var(--l); max-width: 62ch; }

  /* ---- off the record: opinion and fun, kept apart from the reports ---- */
  .off { background: var(--g6); }
  .off .band-t { padding: clamp(46px, 8vh, 84px) 0 6px; }
  .off .band-t .q { font: 700 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--l6); margin-bottom: 12px; }
  .off .band-t h2 { margin: 0; font: 400 clamp(38px, 8vw, 110px)/.9 var(--display); text-transform: uppercase; letter-spacing: -.04em; text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  .off .band-t p { max-width: 54ch; color: var(--dim); font: italic 400 19px/1.55 var(--serif); margin: 14px 0 0; }
  .off .blk { padding: 34px 0; border-top: 1px solid var(--line); margin-top: 34px; }
  .opgrid { display: grid; gap: 34px 54px; margin-top: 22px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .opgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .who { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--l6); } .who span { color: var(--dim); font-weight: 500; }
  .col h3 { font: 600 clamp(24px, 2.8vw, 34px)/1.15 var(--serif); letter-spacing: -.015em; margin: 8px 0 12px; }
  .machine { display: grid; gap: 34px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 900px) { .machine { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; } }
  .rivet-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rivet-slot .rivet .rv-bubble { position: static; margin: 6px 0 0; opacity: 1; transform: none; width: auto; max-width: min(260px, 100%); text-align: center; }
  .rivet-slot .rivet { max-width: 100%; }

  .foot { background: var(--ink); border-top: 6px solid var(--brass); padding: 44px 0 30px; }
  .foot .sign { font: italic 500 clamp(20px, 2.6vw, 30px)/1.45 var(--serif); max-width: 40ch; }
  .foot .row { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: center; }
  @media (min-width: 800px) { .foot .row { grid-template-columns: minmax(0, 1fr) 240px; } }
  .foot .rv-bubble { border: 1px solid var(--ink); box-shadow: none; }
  .folio { display: inline-block; margin-top: 18px; padding: 6px 12px 5px; border-radius: 1px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #1c1d1f;
    background: #b7b8b4 url(img/steel-nameplate.webp) center / cover; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(0,0,0,.3); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .colophon { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); font: 500 10px/1.9 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 120px 0; font: italic 400 22px var(--serif); }

  @media (max-width: 720px) {
    .top { gap: 6px; padding: 8px 12px; } .top .btn, .top button, .top select { min-height: 32px; padding: 0 11px; font-size: 10px; } .top select { max-width: 104px; }
    .chips { top: 48px; }
    .cover { padding-top: 64px; }
    .star { left: auto; right: 10px; top: 214px; width: 92px; }
    .lines { width: 57%; } .cl .k { font-size: 9.5px; } .cl b { font-size: clamp(15px, 4.4vw, 20px); } .cl.lead b { font-size: clamp(22px, 6.6vw, 32px); }
    .cl:nth-child(n+4) { display: none; }
    .credit { max-width: 58%; } .credit .tag { display: none; }
    .rivet-cover { right: -14px; top: auto; bottom: 30px; } .rivet-cover .rv-svg { height: min(34svh, 300px) !important; }
    .issue { flex-direction: column; gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>

<body><div style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#16130E;color:#F1ECE0;font:500 10.5px/1.3 monospace;letter-spacing:.08em;text-align:center;padding:5px 8px;text-transform:uppercase">Design preview &middot; all text is placeholder &middot; real layout, type and colour</div>
<div class="prog" id="prog"></div>
<div class="winbar pywebview-drag-region"><span class="wl pywebview-drag-region">THE RECLAMATION DAILY</span><span><button id="closeWin" title="Close">&#10005;</button></span></div>

<header class="top" id="top">
  <span class="btn" id="back">Preview</span>
  <span class="grow"></span>
  <select id="dateSel" title="Past editions" aria-label="Past editions"></select><button id="fsDown" title="Smaller text" aria-label="Smaller text">A&minus;</button><button id="fsUp" title="Larger text" aria-label="Larger text">A+</button>
</header>
<div id="cover"></div>
<div id="breaking"></div>
<div id="ticker"></div>
<nav class="chips" id="nav" aria-label="Sections"><div class="track" id="track"></div></nav>
<main id="paper" role="main"><div class="empty">Opening the record&hellip;</div></main>

<script src="rivet.js"></script>
<script>
(() => {
  document.documentElement.classList.add('js');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safe = (u) => /^https?:\/\//i.test(u || '') ? u : '';
  const paras = (arr) => (Array.isArray(arr) ? arr : [arr]).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join('');
  const xp = (inner) => `<div class="xp"><div class="in"><div class="pad">${inner}</div></div></div>`;
  const native = new URLSearchParams(location.search).has('native');
  if (native) { document.body.classList.add('native'); $('back').href = '/static/widget.html?native=1'; }
  const api = () => (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  window.addEventListener('pywebviewready', () => document.body.classList.add('native'));
  $('closeWin').addEventListener('click', () => { if (api()) api().close(); });
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="http"]'); if (!a) return; if (api()) { e.preventDefault(); api().open_url(a.href); } else a.target = '_blank'; });

  let fs = +(localStorage.getItem('ncr_paper_fs4') || 17);
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('ncr_paper_fs4', fs); } catch (e) {} };
  $('fsUp').onclick = () => { fs = Math.min(22, fs + 1); applyFs(); }; $('fsDown').onclick = () => { fs = Math.max(13, fs - 1); applyFs(); }; applyFs();

  const PHOTO_BASE = 'photos/';
  const seedOf = (s) => String(s || '').split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const dayOfYear = (s) => { const d = new Date(String(s) + 'T00:00:00'); if (isNaN(d)) return ''; return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); };
  const wc = (arr) => (Array.isArray(arr) ? arr : [arr]).join(' ').split(/\s+/).filter(Boolean).length;
  const LANGN = { fr: 'French', de: 'German', es: 'Spanish', it: 'Italian', pt: 'Portuguese', ja: 'Japanese' };
  const srcRow = (x, withLede) => `<a href="${esc(safe(x.link))}"><b>${esc(x.source)}</b> <small>&mdash; ${esc(x.lean || '')}</small>${x.lang && x.lang !== 'en' ? ` <span class="flag">${esc(LANGN[x.lang] || x.lang)} &rarr; English</span>` : ''}<br>${esc(x.title)}${x.orig ? `<br><small style="font-style:italic">${esc(x.orig)}</small>` : ''}${withLede && x.lede ? `<br><small>${esc(x.lede)}</small>` : ''}</a>`;
  const diffPanel = (ds) => (ds || []).length ? `<div class="cmp">What other outlets do differently</div>${ds.map((d) => `<div class="diff"><b>${esc(d.source)}</b>${d.lang && d.lang !== 'en' ? ` <span class="flag">${esc(LANGN[d.lang] || d.lang)}</span>` : ''} ${esc(d.note)}${d.quote ? `<br><small style="font-style:italic;color:var(--dim)">${esc(d.quote)}</small>` : ''}</div>`).join('')}` : '';
  const short = (n) => String(n).replace(/^the\s+/i, '').replace(/,.*$/, '').trim();

  // ---- photos: the reclamation series; credits.json carries title_en, author, licence, focal point
  let credits = {}, keys = [];
  async function loadCredits() { try { credits = await (await fetch(PHOTO_BASE + 'credits.json')).json(); keys = Object.keys(credits).filter((k) => credits[k] && credits[k].author).sort(); } catch (e) { credits = {}; keys = []; } }
  const photo = (i) => { const k = keys[((i % keys.length) + keys.length) % keys.length]; return k ? { k, c: credits[k] } : null; };
  const imgTag = (p, cls) => p ? `<img ${cls ? `class="${cls}"` : ''} src="${PHOTO_BASE + p.k}.jpg" alt="${esc(p.c.title_en || p.c.title)}" style="object-position:${esc(p.c.focus || '50% 50%')}">` : '';

  // deco rays behind chapter numerals (original composition, drawn once)
  const SUN = (() => { const R = 420, w = []; for (let i = 0; i < 18; i++) { const a = i * 20 * Math.PI / 180, b = (i * 20 + 10) * Math.PI / 180; w.push(`M0 0 L${(R * Math.cos(a)).toFixed(1)} ${(R * Math.sin(a)).toFixed(1)} L${(R * Math.cos(b)).toFixed(1)} ${(R * Math.sin(b)).toFixed(1)} Z`); }
    return `<svg class="sun" viewBox="-200 -200 400 400" aria-hidden="true" focusable="false"><path d="${w.join(' ')}"/></svg>`; })();
  const barcode = (n, date) => { const digits = (String(n) + String(date).replace(/\D/g, '')).padEnd(12, '7').slice(0, 12); let x = 2, bars = ''; for (let i = 0; i < 46; i++) { const d = +digits[i % 12] + (i % 5); const w = 1 + (d % 3); if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="34" fill="#100D09"/>`; x += w + 0.4 + (i % 2 ? 0.6 : 0); } return `<div class="barcode" aria-hidden="true"><svg viewBox="0 0 ${Math.ceil(x + 2)} 34" preserveAspectRatio="none">${bars}</svg><span>${digits.replace(/(\d{2})(\d{5})(\d{5})/, '$1 $2 $3')}</span></div>`; };
  const STAR = (() => { const pts = []; for (let i = 0; i < 32; i++) { const r = i % 2 ? 40 : 49, a = i * Math.PI / 16 - Math.PI / 2; pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1)); }
    return `<svg class="star" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><polygon points="${pts.join(' ')}"/><text x="50" y="43" font-size="11">NOT NEWS.</text><text x="50" y="58" font-size="9">JUST WHAT</text><text x="50" y="69" font-size="9">IS.</text></svg>`; })();

  const chapter = (i) => ({ '--c': `var(--c${(i % 6) + 1})`, '--l': `var(--l${(i % 6) + 1})`, '--g': `var(--g${(i % 6) + 1})` });
  const cv = (i) => { const o = chapter(i); return `--c:${o['--c']};--l:${o['--l']};--g:${o['--g']};--dk:color-mix(in srgb, var(--c${(i % 6) + 1}) 50%, #000)`; };

  function mastHtml(name) {
    const words = String(name || 'The Reclamation Daily').split(/\s+/).filter(Boolean);
    let bi = 0; words.forEach((w, i) => { if (w.length > words[bi].length) bi = i; });
    const pre = words.slice(0, bi).join(' '), post = words.slice(bi + 1).join(' ');
    const big = [...words[bi]].map((ch, i) => `<span style="--i:${i}">${esc(ch)}</span>`).join('');
    return `${pre ? `<span class="sm">${esc(pre)}</span>` : ''}${post ? `<span class="sm r">${esc(post)}</span>` : ''}<span class="big" aria-hidden="true">${big}</span><span class="sr" style="position:absolute;left:-9999px">${esc(name)}</span>`;
  }

  function render(d, archive) {
    const ed = d.edition; if (!ed) { $('paper').innerHTML = '<div class="empty">No edition yet.</div>'; return; }
    const al = ed.almanac || {}, wx = al.weather || {}, days = (wx.days || []).slice(0, 3), mk = al.markets || {};
    const fmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const chg = (x) => x ? `${x.change_24h >= 0 ? '▲' : '▼'}${Math.abs(x.change_24h)}%` : '';
    const secs = ed.sections || [], navs = [];
    const no = dayOfYear(ed.date), pi = seedOf(ed.date);
    const cover = photo(pi);

    // cover lines: the lead report plus up to four more, one per chapter
    const lines = [];
    secs.forEach((s, i) => { const st = (s.stories || [])[0]; if (st && lines.length < 5) lines.push({ i, s, st }); });
    let seen = false; try { const key = 'ncr_cover_' + ed.date; if (localStorage.getItem(key)) seen = true; else localStorage.setItem(key, '1'); } catch (e) {}
    $('cover').innerHTML = `<section class="cover ${seen ? 'seen' : ''}" aria-label="Cover">${imgTag(cover, 'bg')}
      <div class="issue mono"><span>${esc(ed.date_pretty || ed.date)}</span><span>Unbiased reports${no ? ' &middot; Issue N&ordm; ' + no : ''}</span></div>
      <h1 class="mast">${mastHtml(ed.paper)}</h1>${STAR}
      <div class="rivet-cover" id="rivetCover"></div>
      <div class="lines">${lines.map((l, n) => `<a class="cl ${n === 0 ? 'lead' : ''}" href="#s${l.i}" data-t="s${l.i}" style="--i:${n};--l:var(--l${(l.i % 6) + 1})"><span class="k">${esc(short(l.s.name))}</span><b>${esc(l.st.headline)}</b><span class="n">${(l.st.sources || []).length} outlets read</span></a>`).join('')}</div>
      <div class="credit mono"><span class="tag">${cover ? 'PHOTO ' + esc(cover.k.toUpperCase()) : ''}</span>${barcode(no, ed.date)}<span>${cover ? esc(cover.c.title_en || cover.c.title) + ' &mdash; ' + esc(cover.c.author) + ', ' + esc(cover.c.license) : ''}</span></div></section>`;

    const tick = [];
    if (mk.btc) tick.push(`<span><b>BTC</b> $${fmt(mk.btc.usd)} ${chg(mk.btc)}</span>`);
    if (mk.eth) tick.push(`<span><b>ETH</b> $${fmt(mk.eth.usd)} ${chg(mk.eth)}</span>`);
    if (wx.now !== undefined) tick.push(`<span><b>${esc(wx.place)}</b> ${esc(wx.now)}&deg; ${esc(wx.now_sky)}</span>`);
    lines.forEach((l) => tick.push(`<span><b>${esc(short(l.s.name))}</b> ${esc(l.st.headline)}</span>`));
    $('ticker').innerHTML = `<div class="ticker"><span class="live"><i></i>LIVE</span><div class="run"><div>${tick.join('')}${tick.join('')}</div></div></div>`;
    const bk = ed.breaking;
    $('breaking').innerHTML = bk && bk.headline ? `<div class="breaking" role="alert"><div class="in"><span class="pill">BREAKING</span><span class="t">${esc(bk.headline)}</span>${bk.since ? `<span class="s">since ${esc(bk.since)}</span>` : ''}</div></div>` : '';

    let h = `<section class="promise"><div class="wrap"><div class="q">The plain record</div><h2>Not news. Just what is.</h2>
      <p>Every report below is what the sources agree on, followed by a plain note on where they don&rsquo;t. No spin, no opinion, no headline written to make you feel a way. The attitude lives in the design, and in Rivet.</p></div></section>
      <div class="wrap"><div class="nums"><div class="num-tile" style="--c:var(--c1)"><b>${esc(wx.now)}&deg;</b><span>${esc(wx.place)} &middot; ${esc(wx.now_sky)}</span></div>
        <div class="num-tile" style="--c:var(--c3)"><b>${mk.btc ? '$' + fmt(mk.btc.usd) : '-'}</b><span>Bitcoin ${chg(mk.btc)}</span></div>
        <div class="num-tile" style="--c:var(--c5)"><b>${mk.eth ? '$' + fmt(mk.eth.usd) : '-'}</b><span>Ether ${chg(mk.eth)}</span></div></div>
        <div class="rows">${days.map((x) => `${esc(x.date.slice(5))} &middot; ${esc(x.high)}&deg;/${esc(x.low)}&deg; ${esc(x.sky)}, ${esc(x.rain_pct)}% rain`).join('<br>')}${al.moon ? `<br>Moon: ${esc(al.moon.name)}, ${esc(al.moon.illumination)}% lit` : ''}</div></div>
      <section class="tldr"><div class="wrap" id="lazy"></div></section>`;

    secs.forEach((s, i) => {
      navs.push([`s${i}`, s.name, i]);
      const ph = photo(pi + 1 + i);
      const reps = (s.stories || []).map((st, si) => `<article class="rep ${si === 0 ? 'open' : ''}"><div class="h"><h3>${esc(st.headline)}</h3><span class="cnt">${(st.sources || []).length} outlets</span></div>${xp(`${(st.facts || []).length ? `<div class="cmp">What is established &mdash; cross-read from ${st.read || (st.sources || []).length} of ${(st.sources || []).length} outlets</div><ul class="facts">${st.facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}${st.split ? `<div class="cmp">Where the outlets differ</div><div class="split">${esc(st.split)}</div>` : ''}${diffPanel(st.diffs)}<div class="cmp">Every outlet, in their own words</div><div class="src">${(st.sources || []).map((x) => srcRow(x, false)).join('')}</div>`)}</article>`).join('');
      const voiced = ((s.body || []).length || (s.deep && (s.deep.body || []).length)) ? `<div class="art" id="s${i}d" style="margin-top:26px"><div class="ah"><span>The long version, written in the paper&rsquo;s own voice</span></div>${xp(`<div class="body">${paras(s.body)}</div>${s.deep && (s.deep.body || []).length ? `<h3 style="font:600 24px/1.2 var(--serif);margin:24px 0 8px">${esc(s.deep.headline)}</h3><div class="by">${esc(s.deep.subhead || '')}</div><div class="tl" data-tl="s${i}d"></div><div class="body">${paras(s.deep.body)}</div>` : ''}`)}</div>` : '';
      h += `<section class="sec" id="s${i}" style="${cv(i)}"><header class="sh">${imgTag(ph)}${SUN}<div class="in"><span class="num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><h2>${esc(s.name)}</h2></div></header>
        <div class="sec-body"><div class="manual"><span>${(s.stories || []).length} reports</span><span>${Math.max(1, Math.round(wc(s.body) / 210))} min if you want the long version</span></div>
        <div class="oneline" hidden><b>In one line</b><span data-tl="s${i}"></span></div><div class="reps">${reps}</div>${voiced}</div></section>`;
    });

    // ---- the rest of the record
    const mo = ed.more || {}, moKeys = Object.keys(mo);
    if (moKeys.length) {
      const total = moKeys.reduce((n, k) => n + mo[k].items.length, 0); navs.push(['more', 'The rest', 4]);
      h += `<section class="sec" id="more" style="${cv(4)}"><header class="sh">${imgTag(photo(pi + 7))}${SUN}<div class="in"><span class="num" aria-hidden="true">${total}</span><h2>The rest of the record</h2></div></header><div class="sec-body">
        <p class="note">Every report the paper pulled but didn&rsquo;t feature. Each outlet&rsquo;s own headline and its own summary line, side by side, with a link to the original.</p>
        ${moKeys.map((k) => `<div class="lz-g"><div class="lz-h">${esc(mo[k].name)}<span>${mo[k].items.length}</span></div>${xp(mo[k].items.map((it) => `<div class="more-i"><div class="h"><span class="t">${esc(it.headline)}</span><span class="cnt">${it.n} outlet${it.n === 1 ? '' : 's'}</span></div>${xp(`${it.lede ? `<div class="lede">${esc(it.lede)}</div>` : ''}<div class="src">${it.sources.map((x) => srcRow(x, true)).join('')}</div>`)}</div>`).join(''))}</div>`).join('')}</div></section>`;
    }

    // ---- off the record: the opinion columns, the AI column, letters, the long read, the magazine rack
    const op = ed.opinion, lr = ed.longread, mags = ed.magazines || [];
    const hasOff = (op && (op.columns || []).length) || (ed.letters || []).length || (lr && lr.headline) || mags.length;
    if (hasOff) {
      navs.push(['off', 'Off the record', 5]);
      h += `<section class="off" id="off" style="--c:var(--c6);--l:var(--l6)"><div class="wrap"><div class="band-t"><div class="q">Not part of the record</div><h2>Off the record</h2><p>Opinion, an AI&rsquo;s unfiltered thoughts, reader letters and the magazine rack. Kept apart on purpose, so nothing here is mistaken for a report.</p></div>`;
      if (op && (op.columns || []).length) h += `<div class="blk"><div class="lbl">${esc(op.name)} &middot; ${esc(op.label)}</div><div class="opgrid">${op.columns.map((c, j) => `<div class="col" id="c${j}"><div class="who">${esc(c.name)} <span>&middot; ${esc(c.stance)}</span></div><h3>${esc(c.headline)}</h3><div class="tl" data-tl="c${j}"></div><div class="body">${paras(c.body)}</div></div>`).join('')}</div></div>`;
      if (op && op.machine) { const m = op.machine; h += `<div class="blk" id="mach"><div class="machine"><div><div class="lbl">${esc(m.name)} &middot; ${esc(m.stance)}</div><h3 style="font:600 clamp(26px,3.4vw,40px)/1.15 var(--serif);margin:10px 0 12px">${esc(m.headline)}</h3><div class="tl" data-tl="mach"></div>${(m.thinking || []).length ? `<div class="think">${(m.thinking || []).map(esc).join('<br><br>')}</div>` : ''}<div class="body">${paras(m.body)}</div></div><div class="rivet-slot" id="rivetMach"></div></div></div>`; }
      if ((ed.letters || []).length) h += `<div class="blk" id="let"><div class="lbl">Letters</div>${ed.letters.map((l) => `<div class="letter"><div class="lbl" style="margin-bottom:4px">${esc(l.from)}</div><div class="t">${esc(l.text)}</div><div class="r">${esc(l.reply)}</div></div>`).join('')}</div>`;
      if (lr && lr.headline) h += `<div class="blk" id="lr"><div class="lbl">${esc(lr.name || 'The Long Read')}</div><h3 style="font:600 clamp(26px,3.4vw,40px)/1.15 var(--serif);margin:10px 0 6px">${esc(lr.headline)}</h3><div class="by">${esc(lr.subhead)}</div><div class="tl" data-tl="lr"></div><div class="body" style="margin-top:14px">${paras(lr.body)}</div></div>`;
      if (mags.length) h += `<div class="blk" id="mags"><div class="lbl">The Mag Rack</div><div style="margin-top:14px">${mags.map((m, mi) => `<div class="mag" id="mg${mi}" style="--c:var(--c${(mi % 6) + 1});--l:var(--l${(mi % 6) + 1})"><div class="mh"><span class="cv" aria-hidden="true">${esc(String(m.name || '?').replace(/^the\s+/i, '').charAt(0))}</span><div><b>${esc(m.name)}</b><span class="tg">${esc(m.tagline)}</span></div></div>
        ${xp(`<div class="by" style="margin:0 0 6px">edited by ${esc(m.editor)}</div>${(m.editors_note || []).map((t) => `<div class="think">${esc(t)}</div>`).join('')}${(m.articles || []).map((a, bi) => `<div class="art" id="m${mi}_${bi}"><div class="ah"><span>${esc(a.headline)}</span></div>${xp(`<div class="by" style="margin:0 0 4px">${esc(a.byline || '')} ${a.subhead ? '&middot; ' + esc(a.subhead) : ''}</div><div class="tl" data-tl="m${mi}_${bi}"></div><div class="body">${paras(a.body)}</div>`)}</div>`).join('')}`)}</div>`).join('')}</div></div>`;
      h += `</div></section>`;
    }

    const used = new Set(); [cover].concat(secs.map((s, i) => photo(pi + 1 + i)), [photo(pi + 7)]).forEach((p) => { if (p) used.add(p.k); });
    const creditsList = [...used].map((k) => `${esc(credits[k].title_en || credits[k].title)} &mdash; ${esc(credits[k].author)}, ${esc(credits[k].license)}`).join(' &nbsp;&middot;&nbsp; ');
    h += `<footer class="foot"><div class="wrap"><div class="row"><div><div class="sign">${(ed.signoff || []).map(esc).join('<br>')}</div><div class="folio">Edition N&ordm; ${no || ''} &middot; ${esc(ed.date)}</div></div><div class="rivet-slot" id="rivetSign"></div></div>
      <div class="colophon">STYLE ANCHOR: THE NEWSSTAND, REBUILT &middot; unbiased reports, photographed steel, one photograph per chapter &middot; Plate steel: photograph by Gordeonbleu, public domain via Wikimedia Commons &middot; Photographs: ${creditsList}</div></div></footer>`;
    $('paper').innerHTML = h;
    $('track').innerHTML = navs.map(([id, t, ci]) => `<a class="chip" href="#${id}" data-t="${id}" style="--c:var(--c${(ci % 6) + 1})">${esc(short(t))}</a>`).join('');
    $('dateSel').innerHTML = (archive || []).map((a) => `<option value="${esc(a.date)}" ${a.date === ed.date ? 'selected' : ''}>${esc(a.date)}</option>`).join('');
    mountRivets(ed.date);
    fitMast(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMast);
    watch();
  }

  function fitMast() {
    const m = document.querySelector('.mast'), big = m && m.querySelector('.big'); if (!big) return;
    big.style.fontSize = '100px'; const avail = m.clientWidth, w = big.scrollWidth || 1;
    big.style.fontSize = Math.max(28, Math.min(250, Math.floor(100 * avail / w * 0.985))) + 'px';
    const sm = m.querySelectorAll('.sm'); sm.forEach((x) => { x.style.fontSize = Math.max(11, Math.min(34, parseFloat(big.style.fontSize) * 0.17)) + 'px'; });
  }
  addEventListener('resize', fitMast);
  function mountRivets(dateStr) {
    if (!window.Rivet) return;
    const cvr = $('rivetCover');
    if (cvr) { const r = Rivet.make({ size: Math.round(Math.min(500, Math.max(150, innerWidth * (innerWidth < 720 ? 0.44 : 0.32)))), enter: true }); cvr.appendChild(r.el); r.el.title = 'Say hi to Rivet'; r.el.addEventListener('click', () => r.say(Rivet.quip(['fuss', 'report', 'greet', 'weird'][Math.floor(Math.random() * 4)], Math.random() * 1e6 | 0), { mood: 'talk' })); }
    const put = (slot, size, kind, mood) => { const el = $(slot); if (!el) return; const r = Rivet.make({ size, pre: true }); el.appendChild(r.el);
      const io2 = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { io2.disconnect(); r.enter(); setTimeout(() => r.say(Rivet.quip(kind, seedOf(dateStr + kind)), { stay: true, mood, after: 'idle' }), 500); } }), { threshold: 0.35 }); io2.observe(el); };
    put('rivetMach', 300, 'fuss', 'smug'); put('rivetSign', 170, 'signoff', 'talk');
  }

  // active chapter chip + progress bar + the top bar turning solid after the cover. The chips scroll only their own strip.
  let spy = null;
  function watch() {
    if (spy) spy.disconnect();
    spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { let on = null; document.querySelectorAll('#track a').forEach((a) => { const hit = a.dataset.t === e.target.id; a.classList.toggle('on', hit); if (hit) on = a; }); const tr = $('track'); if (on && tr.scrollWidth > tr.clientWidth + 1) tr.scrollTo({ left: on.offsetLeft - (tr.clientWidth - on.offsetWidth) / 2, behavior: 'smooth' }); } }), { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('.sec, .off').forEach((n) => spy.observe(n));
  }
  const setProg = () => { const h = document.documentElement.scrollHeight - innerHeight; $('prog').style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%'; $('top').classList.toggle('solid', scrollY > innerHeight * 0.6); };
  addEventListener('scroll', setProg, { passive: true }); setProg();

  document.addEventListener('click', (e) => {
    const rp = e.target.closest('.rep > .h'); if (rp) rp.parentElement.classList.toggle('open');
    const mh = e.target.closest('.mh'); if (mh) mh.parentElement.classList.toggle('open');
    const ah = e.target.closest('.ah'); if (ah) ah.parentElement.classList.toggle('open');
    const nv = e.target.closest('#track a, .cl'); if (nv) { e.preventDefault(); const t = document.getElementById(nv.dataset.t); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  // ---- accessibility: every expandable row is a real keyboard control
  const TOGGLES = '.rep > .h, .more-i > .h, .mag > .mh, .art > .ah, .lz-g > .lz-h';
  function enhance() {
    document.querySelectorAll(TOGGLES).forEach((el) => {
      if (!el.hasAttribute('role')) { el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); }
      el.setAttribute('aria-expanded', el.parentElement.classList.contains('open') ? 'true' : 'false');
    });
    const sel = $('dateSel'); if (sel) sel.hidden = sel.options.length < 2;
  }
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][tabindex]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('click', () => setTimeout(enhance, 0));
  let enhT = 0;
  new MutationObserver(() => { clearTimeout(enhT); enhT = setTimeout(enhance, 50); }).observe(document.body, { childList: true, subtree: true });
  enhance();

  // ---- TL;DR layer (summaries written by the local model, cached as static JSON)
  let tlTimer = 0;
  async function loadTldr(date) {
    clearTimeout(tlTimer);
    let d; try { const r = await fetch('tldr.json', { cache: 'no-store' }); if (!r.ok) throw 0; d = await r.json(); } catch (e) { $('lazy').innerHTML = ''; return; }
    const items = d.items || {};
    document.querySelectorAll('[data-tl]').forEach((el) => {
      const it = items[el.dataset.tl]; if (!it) return;
      if (el.closest('.oneline')) { el.textContent = it.tldr; el.closest('.oneline').hidden = false; return; }
      el.innerHTML = `<b>TL;DR</b>${esc(it.tldr)}${it.why ? `<em>${esc(it.why)}</em>` : ''}`; el.classList.add('on');
    });
    const groups = {};
    Object.entries(items).forEach(([id, it]) => { (groups[it.group] = groups[it.group] || []).push([id, it]); });
    const names = Object.keys(groups);
    const busy = d.status !== 'ready';
    $('lazy').innerHTML = `<div class="lbl"><span>The whole record, short</span><span>${busy ? `summarizing ${d.done || 0}/${d.total || '?'}…` : (d.built ? 'as of ' + esc(d.built) : '')}</span></div>` +
      (names.length ? names.map((g, gi) => `<div class="lz-g ${gi < 1 ? 'open' : ''}"><div class="lz-h">${esc(g)}<span>${groups[g].length}</span></div>${xp(groups[g].map(([id, it]) =>
        `<div class="lz-i" data-jump="${esc(id)}"><div class="t">${esc(String(it.kind || '').replace(/^(news section|deep dive|magazine feature)[:( ]*/i, '$1 ').slice(0, 40))}</div><div>${esc(it.tldr)}</div>${it.why ? `<small>${esc(it.why)}</small>` : ''}</div>`).join(''))}</div>`).join('')
        : '<div class="note">Summaries are being written &mdash; check back in a few minutes.</div>');
    if (busy) tlTimer = setTimeout(() => loadTldr(date), 25000);
  }
  function jumpTo(id) {
    let el = document.getElementById(id); if (!el) return;
    const mag = el.closest('.mag'); if (mag) mag.classList.add('open');
    if (el.classList.contains('art')) el.classList.add('open');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.addEventListener('click', (e) => {
    const lj = e.target.closest('[data-jump]'); if (lj) jumpTo(lj.dataset.jump);
    const lh = e.target.closest('.lz-h'); if (lh) lh.parentElement.classList.toggle('open');
    const mi = e.target.closest('.more-i'); if (mi && !e.target.closest('a')) mi.classList.toggle('open');
  });

  let archive = [];
  async function load(date) {
    try {
      await loadCredits();
      const d = await (await fetch('edition.json')).json();
      if (!archive.length && d.archive) archive = d.archive;
      render(d, archive); scrollTo(0, 0); if (d.edition) loadTldr(d.edition.date);
    } catch (e) { $('paper').innerHTML = '<div class="empty">Couldn’t reach the record.</div>'; }
  }
  $('dateSel').addEventListener('change', (e) => load(e.target.value));
  load(new URLSearchParams(location.search).get('date'));
})();
</script>
</body>
</html>
