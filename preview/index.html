<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design preview: The Reclamation Daily</title>
<style>
  /* Fresh build (v8). Nothing here overrides an older rule: there are no older rules.
     Ground: warm newsprint. Type: ink. Metal: ONE photographed steel (nameplate + photo frame). Life: chapter colours,
     photography, motion. Orange = the live pulse only. Red = breaking only. */
  @font-face { font-family: 'Archivo Black'; font-weight: 400; font-display: swap; src: url(fonts/ArchivoBlack-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 400 700; font-display: swap; src: url(fonts/Jost-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url(fonts/IBMPlexMono-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(fonts/IBMPlexMono-normal-500.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-display: swap; src: url(fonts/IBMPlexMono-normal-700.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-weight: 400 600; font-display: swap; src: url(fonts/Newsreader-normal-400.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/Newsreader-italic-400.woff2) format('woff2'); }

  :root {
    --paper: #F1ECE0; --paper2: #E8E1D0; --ink: #16130E; --ink2: #2a251b; --mute: #5a5347; --line: rgba(22,19,14,.2);
    --brass: #F0CD7A; --hot: #FF5C00; --red: #ED1C24;
    --c1: #2350FF; --c2: #2F7D5B; --c3: #A67600; --c4: #8C2331; --c5: #1D6F8C; --c6: #B23A6D;
    --ct1: #2350FF; --ct2: #25694A; --ct3: #7A5A00; --ct4: #8C2331; --ct5: #1D6F8C; --ct6: #A8305F;
    --fs: 17px; --ease: cubic-bezier(.22, 1, .36, 1);
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --ui: "Jost", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --screw: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='9.5' fill='%23202225' opacity='.5'/><circle cx='10' cy='10' r='8.2' fill='%23b9bdc2' stroke='%2334373c' stroke-width='1.2'/><circle cx='8' cy='8' r='4' fill='%23e4e6e8' opacity='.6'/><rect x='2.8' y='8.7' width='14.4' height='2.6' rx='.6' fill='%232a2d31'/></svg>");
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--fs)/1.7 var(--serif); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .mono { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 3.2vw, 44px) 40px; }
  .prog { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--ink); z-index: 80; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 1px; }

  .winbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 70; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; cursor: grab; background: var(--ink); color: var(--paper); }
  .native .winbar { display: flex; } .winbar .wl { font: 500 10px var(--mono); letter-spacing: .22em; }
  .winbar button { background: none; box-shadow: none; color: var(--paper); min-height: 24px; padding: 0 8px; }
  .native .wrap { padding-top: 32px; }

  /* ---- controls: ink keys that feel physical ---- */
  .btn, button, select { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper); background: var(--ink); border: 0; border-radius: 2px; padding: 0 14px; min-height: 36px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,19,14,.35); transition: transform .1s ease-out, background-color .16s, color .16s, box-shadow .16s; }
  select { padding-right: 8px; max-width: 150px; } select option { background: #fff; color: #111; }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover, button:hover, select:hover { background: #2b251b; color: var(--brass); transform: translateY(-1px); box-shadow: 0 4px 0 rgba(22,19,14,.3); text-decoration: none; }
  }
  .btn:active, button:active { transform: scale(.97); box-shadow: 0 1px 0 rgba(22,19,14,.4); }
  .grow { flex: 1; }
  .util { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .util .date { color: var(--mute); order: 9; flex-basis: 100%; }
  @media (min-width: 720px) { .util .date { order: 0; flex-basis: auto; margin-left: 10px; } }
  .util .btn, .util button, .util select { padding: 0 11px; }

  /* ---- masthead ---- */
  .mast { padding: 30px 0 10px; text-align: center; }
  .mast .q { font: 500 10.5px var(--mono); letter-spacing: .26em; text-transform: uppercase; color: var(--mute); }
  .plate { position: relative; display: block; margin: 14px auto 12px; width: min(100%, 940px); padding: clamp(18px, 3.4vw, 30px) clamp(30px, 6vw, 68px) clamp(16px, 3vw, 26px); border-radius: 3px;
    background: #a3a4a0 url(img/steel-nameplate.webp) center / cover no-repeat;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.28), 0 16px 22px -16px rgba(0,0,0,.6); animation: settle .5s var(--ease) both; }
  .plate h1 { margin: 0; font: 400 clamp(21px, 6.1vw, 76px)/.96 var(--display); letter-spacing: -.02em; text-transform: uppercase; color: #2a2c30; text-wrap: balance; overflow-wrap: normal;
    text-shadow: 0 1px 0 rgba(255,255,255,.55); }
  .sc { position: absolute; width: 13px; height: 13px; background: var(--screw) center / contain no-repeat; transition: transform .5s var(--ease); }
  .sc.a { left: 10px; top: 10px; transform: rotate(28deg); } .sc.b { right: 10px; top: 10px; transform: rotate(-64deg); }
  .sc.c { left: 10px; bottom: 10px; transform: rotate(75deg); } .sc.d { right: 10px; bottom: 10px; transform: rotate(-12deg); }
  @media (hover: hover) { .plate:hover .sc.a { transform: rotate(88deg); } .plate:hover .sc.b { transform: rotate(-4deg); } .plate:hover .sc.c { transform: rotate(135deg); } .plate:hover .sc.d { transform: rotate(48deg); } }
  .persona { font: italic 400 clamp(15px, 1.6vw, 19px)/1.45 var(--serif); color: var(--mute); margin: 12px auto 0; max-width: 62ch; }
  @keyframes settle { from { transform: translateY(-8px); opacity: .6; } to { transform: none; opacity: 1; } }

  .nav { position: sticky; top: 0; z-index: 60; background: var(--paper); border-top: 4px double var(--ink); border-bottom: 1px solid var(--ink); margin-top: 16px; }
  .native .nav { top: 32px; }
  .track { position: relative; display: flex; gap: clamp(12px, 1.5vw, 20px); overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
  .track::-webkit-scrollbar { display: none; }
  .nav a { flex: none; padding: 14px 2px 13px; min-height: 44px; display: inline-flex; align-items: center; font: 500 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--mute); transition: color .16s; }
  .nav a.on { color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .nav a:hover { color: var(--ct, var(--ink)); text-decoration: none; } }
  .nav .ink { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--ink); transition: transform .26s var(--ease), width .26s var(--ease), background-color .2s; }

  /* ---- breaking (only rendered when the edition has one): the only place red lives ---- */
  .breaking { margin: 0 calc(50% - 50vw); background: var(--ink); color: var(--paper); border-top: 8px solid var(--red); }
  .breaking .in { max-width: 1180px; margin: 0 auto; padding: 12px clamp(16px, 3.2vw, 44px); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .pill { background: var(--red); color: #fff; font: 700 10.5px var(--mono); letter-spacing: .18em; padding: 4px 10px; border-radius: 1px; }
  .breaking .t { font: 600 clamp(16px, 2vw, 20px)/1.3 var(--serif); }
  .breaking .s { font: 500 11px var(--mono); letter-spacing: .1em; color: rgba(241,236,224,.7); margin-left: auto; }

  /* ---- ticker: brass readout on ink, the one live thing ---- */
  .ticker { margin: 0 calc(50% - 50vw); background: var(--ink); color: var(--brass); display: flex; align-items: center; overflow: hidden; }
  .live { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px 10px clamp(16px, 3.2vw, 44px); font: 700 10.5px var(--mono); letter-spacing: .2em; color: var(--paper); background: var(--ink); position: relative; z-index: 1; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
  .run { flex: 1; overflow: hidden; }
  .run > div { display: inline-flex; gap: 38px; white-space: nowrap; padding-left: 100%; animation: marq 60s linear infinite; font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .ticker:focus-within .run > div { animation-play-state: paused; }
  @media (hover: hover) and (pointer: fine) { .ticker:hover .run > div { animation-play-state: paused; } }
  .run b { color: var(--paper); font-weight: 700; }
  @keyframes marq { to { transform: translateX(-100%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }

  /* ---- the daily photograph in its steel frame ---- */
  .hero { margin: 24px 0 6px; }
  .hero .frame { position: relative; padding: clamp(8px, 1.4vw, 14px); border-radius: 3px; background: #9b9c98 url(img/steel-frame.webp) center / cover;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 1px rgba(0,0,0,.3); overflow: hidden; }
  .hero img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; border: 1px solid rgba(0,0,0,.6); }
  @media (max-width: 640px) { .hero img { aspect-ratio: 4 / 3; } }
  .hero.dev img { animation: develop 1.2s var(--ease) both; }
  @keyframes develop { from { filter: grayscale(1) contrast(1.25) brightness(.7); } to { filter: none; } }
  .hero .spec { position: absolute; left: clamp(20px, 2.6vw, 32px); bottom: clamp(20px, 2.6vw, 32px); padding: 5px 10px 4px; border-radius: 1px; font: 500 10px/1.2 var(--mono); letter-spacing: .12em; color: #1c1d1f;
    background: #b7b8b4 url(img/steel-nameplate.webp) center / cover; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(0,0,0,.3), 0 6px 10px -6px rgba(0,0,0,.6); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .hero .full { position: absolute; left: clamp(8px, 1.4vw, 14px); right: clamp(8px, 1.4vw, 14px); bottom: clamp(8px, 1.4vw, 14px); padding: 16px 18px; background: rgba(22,19,14,.88); color: var(--paper);
    font: italic 500 clamp(16px, 2vw, 24px)/1.3 var(--serif); transform: translateY(101%); transition: transform .32s var(--ease); }
  @media (hover: hover) and (pointer: fine) { .hero .frame:hover .full, .hero .frame:focus-within .full { transform: none; } .hero .frame:hover .spec { opacity: 0; } }
  .hero .spec { transition: opacity .2s; }
  .hero figcaption { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; padding: 10px 2px 0; font: 500 11px/1.5 var(--mono); letter-spacing: .06em; color: var(--mute); }

  /* ---- front page ---- */
  .lead { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; margin: 38px 0 8px; }
  @media (min-width: 1000px) { .lead { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; } }
  .lead .q { font: 500 10.5px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--ct1); margin-bottom: 10px; }
  .headline { font: 600 clamp(36px, 6.4vw, 84px)/.98 var(--serif); letter-spacing: -.028em; margin: 0; text-wrap: balance; }
  .dek { font: italic 400 clamp(19px, 2.2vw, 26px)/1.45 var(--serif); color: var(--ink2); margin: 18px 0 0; max-width: 46ch; }
  .sheet { border-top: 4px double var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 0 10px; align-self: start; }
  .sheet .lbl, .lbl { font: 500 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); margin: 10px 0 6px; }
  .nums > div { padding: 4px 8px 4px 0; } .nums > div + div { border-left: 1px solid var(--line); padding-left: 10px; }
  .nums b { display: block; font: 700 clamp(19px, 2.2vw, 26px)/1.1 var(--mono); letter-spacing: -.03em; }
  .nums span { font: 500 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .sheet .row { padding: 7px 0; border-top: 1px solid var(--line); font: 500 11.5px/1.5 var(--mono); letter-spacing: .04em; color: var(--ink2); }
  .sheet .blurb { padding-top: 10px; border-top: 1px solid var(--line); font: italic 400 15.5px/1.55 var(--serif); }

  .tldr { margin: 34px 0 0; border-top: 1px solid var(--ink); }
  .tldr > .lbl { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
  .lz-g { border-top: 1px solid var(--line); }
  .lz-h { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; transition: transform .22s var(--ease), color .16s; }
  .lz-h span { margin-left: auto; color: var(--mute); font-weight: 500; }
  .lz-h::after, .story > .h::after, .more-i > .h::after, .mag > .mh::after, .art > .ah::after { content: "+"; flex: none; font: 500 18px/1 var(--mono); transition: transform .26s var(--ease); }
  .open > .lz-h::after, .open > .h::after, .open > .mh::after, .open > .ah::after { transform: rotate(45deg); }
  .lz-i { padding: 8px 0 8px 14px; margin: 4px 0; border-left: 3px solid var(--line); cursor: pointer; transition: border-color .2s, transform .22s var(--ease); }
  @media (hover: hover) and (pointer: fine) { .lz-i:hover { border-left-color: var(--c1); transform: translateX(3px); } }
  .lz-i .t { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .lz-i div { font: 500 15px/1.45 var(--ui); } .lz-i small { display: block; color: var(--mute); font: italic 400 14px var(--serif); margin-top: 2px; }

  /* expanding rows: grid 0fr -> 1fr, no layout jump */
  .xp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s var(--ease); }
  .xp > .in { overflow: hidden; min-height: 0; }
  .open > .xp, .lz-g.open > .xp { grid-template-rows: 1fr; }
  .pad { padding: 4px 0 14px 16px; margin-left: 2px; border-left: 3px solid var(--c, var(--ink)); }

  /* ---- sections: one chapter colour, spent on the numeral, the quote marks, the rules and the hovers ---- */
  .rv { opacity: 0; transform: translateY(24px); transition: opacity .52s var(--ease), transform .52s var(--ease); }
  .rv.in, html:not(.js) .rv { opacity: 1; transform: none; }
  .sec { margin: 72px 0 0; }
  .sh { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: clamp(14px, 2.6vw, 34px); border-top: 4px solid var(--ink); padding-top: 14px; }
  .num { font: 400 clamp(64px, 11vw, 148px)/.8 var(--display); color: var(--c); letter-spacing: -.04em; }
  .sh h2 { margin: 0 0 4px; font: 400 clamp(26px, 4.4vw, 52px)/1 var(--display); text-transform: uppercase; letter-spacing: -.02em; }
  .by { font: 500 11px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-top: 6px; }
  .cols { display: grid; gap: 34px; margin-top: 26px; }
  @media (min-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; } .rail { border-left: 1px solid var(--line); padding-left: 32px; } }
  .sub { font: 600 clamp(21px, 2.4vw, 29px)/1.25 var(--serif); letter-spacing: -.01em; margin: 0 0 14px; }
  .pull { font: italic 500 clamp(21px, 2.6vw, 32px)/1.3 var(--serif); border-left: 5px solid var(--c); padding: 2px 0 2px 20px; margin: 18px 0 24px; text-wrap: balance; }
  .body p { margin: 0 0 1.1em; max-width: 66ch; }
  .tl { display: none; margin: 14px 0; padding: 10px 14px; background: var(--paper2); font: 500 14.5px/1.5 var(--ui); max-width: 66ch; }
  .tl.on { display: block; animation: rise .4s var(--ease) both; }
  .tl b { font: 700 10px var(--mono); letter-spacing: .16em; margin-right: 8px; color: var(--ct, var(--ct1)); }
  .tl em { display: block; font: italic 400 14px var(--serif); color: var(--mute); margin-top: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .manual { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .manual b { color: var(--ink); } .manual svg { width: 14px; height: 14px; vertical-align: -3px; margin-right: 4px; }

  .rl { font: 500 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ct); padding-bottom: 8px; }
  .rl span { color: var(--mute); }
  .story, .art, .more-i, .mag { border-top: 1px solid var(--line); }
  .story > .h, .more-i > .h, .art > .ah { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; padding: 12px 2px 12px 0; cursor: pointer; font: 600 15.5px/1.35 var(--ui);
    transition: transform .22s var(--ease), color .16s; }
  .art > .ah { font-family: var(--serif); font-size: 19px; font-weight: 600; }
  @media (hover: hover) and (pointer: fine) {
    .story > .h:hover, .more-i > .h:hover, .art > .ah:hover, .lz-h:hover, .mag > .mh:hover { transform: translateY(-3px); color: var(--ct, var(--ct1)); }
  }
  .story > .h:active, .more-i > .h:active, .art > .ah:active, .lz-h:active, .mag > .mh:active { transform: scale(.985); transition-duration: .08s; }
  .story .t { flex: 1; } .n { flex: none; font: 500 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 7px; border-radius: 1px; color: var(--ct, var(--mute)); }
  .src a { display: block; padding: 6px 0; font: 500 14px/1.45 var(--ui); } .src small { color: var(--mute); font-weight: 400; }
  .cmp { font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ct, var(--mute)); margin: 10px 0 2px; }
  .facts { margin: 4px 0 8px; padding-left: 18px; font: 500 14px/1.5 var(--ui); } .facts li { margin: 3px 0; }
  .split { margin: 6px 0 8px; padding: 8px 12px; background: var(--paper2); border-left: 3px solid var(--c, var(--ink)); font: 500 13.5px/1.5 var(--ui); }
  .diff { padding: 6px 0 6px 12px; margin: 4px 0; border-left: 3px solid var(--line); font: 500 13.5px/1.5 var(--ui); } .diff b { color: var(--ct, var(--ink)); }
  .flag { display: inline-block; font: 500 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--mute); color: var(--mute); vertical-align: 1px; }
  .lede { color: var(--mute); font: 400 14px/1.45 var(--ui); margin: 0 0 4px; }
  .note { font: italic 400 15px/1.55 var(--serif); color: var(--mute); margin: 12px 0 10px; max-width: 66ch; }
  .think { font: italic 400 17px/1.6 var(--serif); border-left: 3px solid var(--c, var(--line)); padding-left: 14px; margin: 10px 0 16px; max-width: 66ch; }
  .letter { padding: 14px 0; border-top: 1px solid var(--line); } .letter .t { font: 500 18px/1.5 var(--serif); max-width: 62ch; } .letter .r { font: italic 400 16px/1.55 var(--serif); color: var(--mute); margin-top: 6px; padding-left: 14px; border-left: 3px solid var(--c); max-width: 62ch; }

  /* magazines: a coloured cover tile per title */
  .mag > .mh { display: flex; align-items: center; gap: 16px; min-height: 76px; cursor: pointer; transition: transform .22s var(--ease), color .16s; }
  .cv { flex: none; width: 46px; height: 62px; display: grid; place-items: center; color: #fff; font: 400 26px var(--display); background: var(--c); border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  .mag .mh b { font: 400 clamp(17px, 2vw, 22px) var(--display); text-transform: uppercase; letter-spacing: -.01em; } .mag .mh span { display: block; font: 500 11px var(--mono); letter-spacing: .06em; color: var(--mute); text-transform: uppercase; }
  .mag .mh > div { flex: 1; }

  /* dark bands: the loud half of the loud/quiet rhythm */
  .band { margin: 84px calc(50% - 50vw) 0; padding: 60px calc(50vw - 50%) 64px; background: var(--ink); color: var(--paper); --c: var(--brass); }
  .band .sh { border-top-color: var(--brass); } .band .num { color: var(--brass); } .band .by { color: rgba(241,236,224,.62); }
  .band :focus-visible { outline-color: var(--brass); } .band .tl { background: rgba(241,236,224,.09); } .band .tl em { color: rgba(241,236,224,.62); }
  .opgrid { display: grid; gap: 40px 56px; margin-top: 30px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .opgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .who { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); } .who span { color: rgba(241,236,224,.6); }
  .col h3 { font: 600 clamp(24px, 2.8vw, 34px)/1.15 var(--serif); letter-spacing: -.015em; margin: 8px 0 12px; }
  .band .body p { color: rgba(241,236,224,.92); }
  .machine { display: grid; gap: 34px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 900px) { .machine { grid-template-columns: minmax(0, 1fr) 280px; gap: 64px; } }
  .rivet-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 6px; }
  .rivet-slot .rivet .rv-bubble { position: static; margin: 6px 0 0; opacity: 1; transform: none; width: auto; max-width: min(260px, 100%); text-align: center; }
  .rivet-slot .rivet { max-width: 100%; }

  .foot { margin-top: 90px; border-top: 4px double var(--ink); padding: 34px 0 20px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 800px) { .foot { grid-template-columns: minmax(0, 1fr) 260px; align-items: center; } }
  .sign { font: italic 500 clamp(20px, 2.6vw, 30px)/1.45 var(--serif); max-width: 40ch; }
  .fin { font: 500 11px var(--mono); letter-spacing: .34em; text-transform: uppercase; color: var(--mute); margin-top: 16px; }
  .foot .rivet .rv-bubble { border: 1px solid var(--ink); box-shadow: none; }
  .colophon { grid-column: 1 / -1; font: 500 10px/1.8 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); border-top: 1px solid var(--line); padding-top: 14px; }
  .empty { color: var(--mute); text-align: center; padding: 90px 0; font: italic 400 20px var(--serif); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .rv { opacity: 1; transform: none; }
  }

  /* ---- printed feel: a hair of ink spread on display type; one more machine-room moment: the steel folio plate ---- */
  .headline, .sub, .pull, .sh h2, .col h3 { text-shadow: 0 0 .7px rgba(22,19,14,.5); }
  .band .col h3, .band .sh h2 { text-shadow: 0 0 .7px rgba(241,236,224,.45); }
  .folio { display: inline-block; margin-top: 18px; padding: 6px 12px 5px; border-radius: 1px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #1c1d1f;
    background: #b7b8b4 url(img/steel-nameplate.webp) center / cover; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(0,0,0,.3), 0 6px 10px -6px rgba(0,0,0,.6); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
</style>
</head>
<body><div style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#16130E;color:#F1ECE0;font:500 10.5px/1.3 monospace;letter-spacing:.08em;text-align:center;padding:5px 8px;text-transform:uppercase">Design preview &middot; all text is placeholder &middot; real layout, type and colour</div>
<div class="prog" id="prog"></div>
<div class="winbar pywebview-drag-region"><span class="wl pywebview-drag-region">THE RECLAMATION DAILY</span><span><button id="closeWin" title="Close">&#10005;</button></span></div>

<div class="wrap">
  <div class="util">
    <span class="btn" id="back">Preview</span>
    <span class="mono date" id="utilDate"></span>
    <span class="grow"></span>
    <select id="dateSel" title="Past editions" aria-label="Past editions"></select><button id="fsDown" title="Smaller text" aria-label="Smaller text">A&minus;</button><button id="fsUp" title="Larger text" aria-label="Larger text">A+</button>
  </div>
  <div id="mast"></div>
  <nav class="nav" id="nav" aria-label="Sections"><div class="track" id="track"></div></nav>
  <div id="ticker"></div>
  <div id="breaking"></div>
  <div id="heroSlot"></div>
  <div id="paper" role="main"><div class="empty">Opening the paper&hellip;</div></div>
</div>

<script src="rivet.js"></script>
<script>
(() => {
  document.documentElement.classList.add('js');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safe = (u) => /^https?:\/\//i.test(u || '') ? u : '';
  const paras = (arr) => (Array.isArray(arr) ? arr : [arr]).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join('');
  const pullOf = (arr) => { const t = String((Array.isArray(arr) ? arr[0] : arr) || '').replace(/\s+/g, ' '); const m = t.match(/^.{40,170}?[.!?](\s|$)/); return m ? m[0].trim() : (t.length > 150 ? t.slice(0, 147) + '…' : t); };
  const xp = (inner) => `<div class="xp"><div class="in"><div class="pad">${inner}</div></div></div>`;
  const native = new URLSearchParams(location.search).has('native');
  if (native) { document.body.classList.add('native'); $('back').href = '/static/widget.html?native=1'; }
  const api = () => (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  window.addEventListener('pywebviewready', () => document.body.classList.add('native'));
  $('closeWin').addEventListener('click', () => { if (api()) api().close(); });
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="http"]'); if (!a) return; if (api()) { e.preventDefault(); api().open_url(a.href); } else a.target = '_blank'; });

  let fs = +(localStorage.getItem('ncr_paper_fs3') || 17);
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('ncr_paper_fs3', fs); } catch (e) {} };
  $('fsUp').onclick = () => { fs = Math.min(22, fs + 1); applyFs(); }; $('fsDown').onclick = () => { fs = Math.max(13, fs - 1); applyFs(); }; applyFs();

  const tokv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const CH = [1, 2, 3, 4, 5, 6].map((n) => tokv('--c' + n)), CT = [1, 2, 3, 4, 5, 6].map((n) => tokv('--ct' + n));
  const ctOf = (c) => CT[Math.max(0, CH.indexOf(c))] || c;
  const shortName = (n) => String(n).replace(/^the\s+/i, '').replace(/,.*$/, '').trim();
  const PHOTO_BASE = 'photos/';
  const seedOf = (s) => String(s || '').split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const dayOfYear = (s) => { const d = new Date(String(s) + 'T00:00:00'); if (isNaN(d)) return ''; return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); };
  const PERSON = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.4" r="2.2" fill="currentColor"/><path d="M8 6 V11 M3 8 L13 8 M8 11 L4.5 15 M8 11 L11.5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  const wc = (arr) => (Array.isArray(arr) ? arr : [arr]).join(' ').split(/\s+/).filter(Boolean).length;
  const LANGN = { fr: 'French', de: 'German', es: 'Spanish', it: 'Italian', pt: 'Portuguese', ja: 'Japanese' };
  const srcRow = (x, withLede) => `<a href="${esc(safe(x.link))}"><b>${esc(x.source)}</b> <small>&mdash; ${esc(x.lean || '')}</small>${x.lang && x.lang !== 'en' ? ` <span class="flag">${esc(LANGN[x.lang] || x.lang)} &rarr; English</span>` : ''}<br>${esc(x.title)}${x.orig ? `<br><small style="font-style:italic">${esc(x.orig)}</small>` : ''}${withLede && x.lede ? `<br><small>${esc(x.lede)}</small>` : ''}</a>`;
  const diffPanel = (ds) => (ds || []).length ? `<div class="cmp">What other outlets do differently</div>${ds.map((d) => `<div class="diff"><b>${esc(d.source)}</b>${d.lang && d.lang !== 'en' ? ` <span class="flag">${esc(LANGN[d.lang] || d.lang)}</span>` : ''} ${esc(d.note)}${d.quote ? `<br><small style="font-style:italic;color:var(--mute)">&ldquo;${esc(d.quote)}&rdquo;</small>` : ''}</div>`).join('')}` : '';

  // Bing-style daily photo, picked by the edition date, always credited; "develops" once per edition per device
  async function mountHero(dateStr) {
    if ($('hero')) return;
    let credits; try { credits = await (await fetch(PHOTO_BASE + 'credits.json')).json(); } catch (e) { return; }
    const keys = Object.keys(credits).filter((k) => credits[k] && credits[k].author).sort(); if (!keys.length) return;
    const k = keys[seedOf(dateStr) % keys.length], c = credits[k], title = c.title_en || c.title;
    let dev = false; try { const key = 'ncr_dev_' + dateStr; if (!localStorage.getItem(key)) { localStorage.setItem(key, '1'); dev = true; } } catch (e) {}
    const fig = document.createElement('figure'); fig.className = 'hero' + (dev ? ' dev' : ''); fig.id = 'hero'; fig.style.margin = '24px 0 6px';
    fig.innerHTML = `<div class="frame" tabindex="0"><img src="${PHOTO_BASE + k}.jpg" alt="${esc(title)}" loading="eager"><span class="spec">PLATE ${esc(k.toUpperCase())} &middot; ${esc(String(dateStr || '').replace(/-/g, '.'))}</span><div class="full">${esc(title)}</div></div>
      <figcaption><span>${esc(title)}</span><span>${esc(c.author)}, ${esc(c.license)}${safe(c.page) ? ` &middot; <a href="${esc(safe(c.page))}">source</a>` : ''}</span></figcaption>`;
    $('heroSlot').replaceChildren(fig);
  }

  function render(d, archive) {
    const ed = d.edition; if (!ed) { $('paper').innerHTML = '<div class="empty">No edition yet.</div>'; return; }
    const al = ed.almanac || {}, wx = al.weather || {}, days = (wx.days || []).slice(0, 3), mk = al.markets || {};
    const fmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const chg = (x) => x ? `${x.change_24h >= 0 ? '▲' : '▼'}${Math.abs(x.change_24h)}%` : '';
    const per = ed.persona || {}, cur = per.currently || {}, navs = [];
    const secs = ed.sections || [];
    const no = dayOfYear(ed.date);
    $('utilDate').textContent = `${ed.date_pretty || ed.date}${no ? ' · Edition Nº ' + no : ''}`;
    $('mast').innerHTML = `<div class="mast"><div class="q">the daily &middot; no filter</div><div class="plate"><i class="sc a"></i><i class="sc b"></i><i class="sc c"></i><i class="sc d"></i><h1>${esc(ed.paper)}</h1></div>
      <div class="persona">run by ${esc(per.name)} (${esc(per.role)}), feeling ${esc(per.mood)}${cur.listening ? `, vibing to ${esc(cur.listening)}` : ''}</div></div>`;

    const tick = [];
    if (mk.btc) tick.push(`<span><b>BTC</b> $${fmt(mk.btc.usd)} ${chg(mk.btc)}</span>`);
    if (mk.eth) tick.push(`<span><b>ETH</b> $${fmt(mk.eth.usd)} ${chg(mk.eth)}</span>`);
    if (wx.now !== undefined) tick.push(`<span><b>${esc(wx.place)}</b> ${esc(wx.now)}&deg; ${esc(wx.now_sky)}</span>`);
    secs.forEach((s) => tick.push(`<span><b>${esc(s.name)}</b> ${esc(s.subhead)}</span>`));
    $('ticker').innerHTML = `<div class="ticker"><span class="live"><i></i>LIVE</span><div class="run"><div>${tick.join('')}${tick.join('')}</div></div></div>`;
    const bk = ed.breaking;
    $('breaking').innerHTML = bk && bk.headline ? `<div class="breaking" role="alert"><div class="in"><span class="pill">BREAKING</span><span class="t">${esc(bk.headline)}</span>${bk.since ? `<span class="s">since ${esc(bk.since)}</span>` : ''}</div></div>` : '';

    let h = `<div class="lead"><div><div class="q">front page</div><h2 class="headline">${esc(ed.headline)}</h2><p class="dek">${esc(ed.dek)}</p></div>
      <aside class="sheet" aria-label="Vibe check"><div class="lbl">Vibe check</div><div class="nums">
        <div><b>${esc(wx.now)}&deg;</b><span>${esc(wx.place)}</span></div><div><b>${mk.btc ? '$' + fmt(mk.btc.usd) : '-'}</b><span>BTC ${chg(mk.btc)}</span></div><div><b>${mk.eth ? '$' + fmt(mk.eth.usd) : '-'}</b><span>ETH ${chg(mk.eth)}</span></div></div>
        ${days.map((x) => `<div class="row">${esc(x.date.slice(5))} &middot; ${esc(x.high)}&deg;/${esc(x.low)}&deg; ${esc(x.sky)}, ${esc(x.rain_pct)}% rain</div>`).join('')}
        ${al.moon ? `<div class="row">Moon: ${esc(al.moon.name)}, ${esc(al.moon.illumination)}% lit</div>` : ''}
        ${(al.blurb || []).map((b) => `<div class="blurb">${esc(b)}</div>`).join('')}</aside></div><div id="lazy"></div>`;

    secs.forEach((s, i) => {
      const c = CH[i % CH.length]; navs.push([`s${i}`, s.name, c]);
      const rail = (s.stories || []).length ? `<aside class="rail" aria-label="Receipts"><div class="rl">Receipts <span>&mdash; assembly not required</span></div>${s.stories.map((st) => `<div class="story"><div class="h"><span class="t">${esc(st.headline)}</span><span class="n">${(st.sources || []).length} outlets</span></div>${xp(`<div class="src">${(st.facts || []).length ? `<div class="cmp">Facts &mdash; cross-read from ${st.read || (st.sources || []).length} of ${(st.sources || []).length} outlets</div><ul class="facts">${st.facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}${st.split ? `<div class="split"><b>Where the outlets differ:</b> ${esc(st.split)}</div>` : ''}${diffPanel(st.diffs)}<div class="cmp">Every outlet, in their own words</div>${(st.sources || []).map((x) => srcRow(x, false)).join('')}</div>`)}</div>`).join('')}</aside>` : '';
      const deep = s.deep && (s.deep.body || []).length ? `<div class="art" id="s${i}d"><div class="ah"><span>${esc(s.deep.headline)}</span></div>${xp(`<div class="by" style="margin:0 0 6px">${esc(s.deep.subhead || '')}</div><div class="tl" data-tl="s${i}d"></div><div class="body">${paras(s.deep.body)}</div>`)}</div>` : '';
      h += `<section class="sec rv" id="s${i}" style="--c:${c};--ct:${ctOf(c)}"><header class="sh"><span class="num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><div><h2>${esc(s.name)}</h2>
        <div class="manual"><span>by ${esc(s.byline)}</span><span>${PERSON}${Math.max(1, Math.round(wc(s.body) / 210))} min read</span></div></div></header>
        <div class="cols"><div><p class="sub">${esc(s.subhead)}</p><div class="tl" data-tl="s${i}"></div><div class="pull">${esc(pullOf(s.body))}</div><div class="body">${paras(s.body)}</div>${deep ? `<div style="margin-top:24px"><div class="lbl" style="color:${ctOf(c)}">Cover story</div>${deep}</div>` : ''}</div>${rail}</div></section>`;
    });

    const op = ed.opinion;
    if (op && (op.columns || []).length) {
      navs.push(['op', 'Hot Takes', '#16130E']);
      h += `<section class="band rv" id="op"><header class="sh"><span class="num" aria-hidden="true">HT</span><div><h2>${esc(op.name)}</h2><div class="by">${esc(op.label)}</div></div></header>
        <div class="opgrid">${op.columns.map((c, j) => `<div class="col" id="c${j}"><div class="who">${esc(c.name)} <span>&middot; ${esc(c.stance)}</span></div><h3>${esc(c.headline)}</h3><div class="tl" data-tl="c${j}"></div><div class="body">${paras(c.body)}</div></div>`).join('')}</div></section>`;
      if (op.machine) {
        const m = op.machine; navs.push(['mach', 'The Machine', '#16130E']);
        h += `<section class="band rv" id="mach" style="margin-top:0;border-top:1px solid rgba(241,236,224,.18)"><header class="sh"><span class="num" aria-hidden="true">AI</span><div><h2>${esc(m.name)}</h2><div class="by">${esc(m.stance)}</div></div></header>
          <div class="machine"><div><p class="sub" style="margin-top:26px">${esc(m.headline)}</p><div class="tl" data-tl="mach"></div>${(m.thinking || []).length ? `<div class="think">${(m.thinking || []).map(esc).join('<br><br>')}</div>` : ''}<div class="body">${paras(m.body)}</div></div><div class="rivet-slot" id="rivetMach"></div></div></section>`;
      }
    }
    if ((ed.letters || []).length) {
      navs.push(['let', 'Letters', CH[3]]);
      h += `<section class="sec rv" id="let" style="--c:${CH[3]};--ct:${CT[3]}"><header class="sh"><span class="num" aria-hidden="true">DM</span><div><h2>Letters</h2></div></header><div style="margin-top:22px;max-width:760px">${ed.letters.map((l) => `<div class="letter"><div class="lbl" style="margin-bottom:4px">${esc(l.from)}</div><div class="t">${esc(l.text)}</div><div class="r">${esc(l.reply)}</div></div>`).join('')}</div></section>`;
    }
    const lr = ed.longread;
    if (lr && lr.headline) {
      navs.push(['lr', 'Long Read', CH[4]]);
      h += `<section class="sec rv" id="lr" style="--c:${CH[4]};--ct:${CT[4]}"><header class="sh"><span class="num" aria-hidden="true">LR</span><div><h2>${esc(lr.name || 'The Long Read')}</h2><div class="by">${esc(lr.subhead)}</div></div></header>
        <div class="cols"><div><p class="sub">${esc(lr.headline)}</p><div class="tl" data-tl="lr"></div><div class="body">${paras(lr.body)}</div></div>
        ${(lr.sources || []).length ? `<aside class="rail"><div class="rl">Reading list</div>${lr.sources.map((x) => `<div class="art"><a href="${esc(safe(x.link))}" style="display:block;padding:10px 0;font:600 15px/1.4 var(--ui)">${esc(x.source)} <small style="color:var(--mute);font-weight:400">&mdash; ${esc(x.title)}</small></a></div>`).join('')}</aside>` : ''}</div></section>`;
    }
    if ((ed.magazines || []).length) {
      navs.push(['mags', 'Mag Rack', CH[5]]);
      h += `<section class="sec rv" id="mags" style="--c:${CH[5]};--ct:${CT[5]}"><header class="sh"><span class="num" aria-hidden="true">${ed.magazines.length}</span><div><h2>The Mag Rack</h2></div></header><div style="margin-top:22px">${ed.magazines.map((m, mi) => `<div class="mag" id="mg${mi}" style="--c:${CH[mi % CH.length]};--ct:${CT[mi % CH.length]}"><div class="mh"><span class="cv" aria-hidden="true">${esc(String(m.name || '?').replace(/^the\s+/i, '').charAt(0))}</span><div><b>${esc(m.name)}</b><span>${esc(m.tagline)}</span></div></div>
        ${xp(`<div class="by" style="margin:0 0 6px">edited by ${esc(m.editor)}</div>${(m.editors_note || []).map((t) => `<div class="think">${esc(t)}</div>`).join('')}${(m.articles || []).map((a, bi) => `<div class="art" id="m${mi}_${bi}"><div class="ah"><span>${esc(a.headline)}</span></div>${xp(`<div class="by" style="margin:0 0 4px">${esc(a.byline || '')} ${a.subhead ? '&middot; ' + esc(a.subhead) : ''}</div><div class="tl" data-tl="m${mi}_${bi}"></div><div class="body">${paras(a.body)}</div>`)}</div>`).join('')}`)}</div>`).join('')}</div></section>`;
    }
    const mo = ed.more || {}, moKeys = Object.keys(mo);
    if (moKeys.length) {
      const total = moKeys.reduce((n, k) => n + mo[k].items.length, 0); navs.push(['more', 'More', CH[0]]);
      h += `<section class="sec rv" id="more" style="--c:${CH[0]};--ct:${CT[0]}"><header class="sh"><span class="num" aria-hidden="true">${total}</span><div><h2>The Rest of the Pile</h2></div></header>
        <p class="note">Every story the paper pulled but didn&rsquo;t print. Facts only: each outlet&rsquo;s own headline and its own summary line, side by side, with a link to the original. No spin added by us.</p>
        ${moKeys.map((k) => `<div class="lz-g"><div class="lz-h">${esc(mo[k].name)}<span>${mo[k].items.length} more</span></div>${xp(mo[k].items.map((it) => `<div class="more-i"><div class="h"><span class="t">${esc(it.headline)}</span><span class="n">${it.n} outlet${it.n === 1 ? '' : 's'}</span></div>${xp(`${it.lede ? `<div class="lede">${esc(it.lede)}</div>` : ''}<div class="src">${it.sources.map((x) => srcRow(x, true)).join('')}</div>`)}</div>`).join(''))}</div>`).join('')}</section>`;
    }
    h += `<footer class="foot"><div><div class="sign">${(ed.signoff || []).map(esc).join('<br>')}</div><div class="fin">that&rsquo;s the paper</div><div class="folio">Edition N&ordm; ${no || ''} &middot; ${esc(ed.date)}</div></div><div class="rivet-slot" id="rivetSign"></div>
      <div class="colophon">STYLE ANCHOR: THE INDUSTRIAL NEWSPAPER &middot; warm newsprint, ink, one photographed steel &middot; Plate steel: photograph by Gordeonbleu, public domain via Wikimedia Commons &middot; Daily photograph credited beneath it</div></footer>`;
    $('paper').innerHTML = h;
    $('track').innerHTML = navs.map(([id, t, c]) => `<a href="#${id}" data-t="${id}" style="--c:${c};--ct:${ctOf(c)}">${esc(shortName(t))}</a>`).join('') + '<span class="ink" id="navInk"></span>';
    $('dateSel').innerHTML = (archive || []).map((a) => `<option value="${esc(a.date)}" ${a.date === ed.date ? 'selected' : ''}>${esc(a.date)}</option>`).join('');
    mountRivets(ed.date);
    watch();
  }

  function mountRivets(dateStr) {
    if (!window.Rivet) return;
    const put = (slot, size, kind, mood) => { const el = $(slot); if (!el) return; const r = Rivet.make({ size, pre: true }); el.appendChild(r.el);
      const io2 = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { io2.disconnect(); r.enter(); setTimeout(() => r.say(Rivet.quip(kind, seedOf(dateStr + kind)), { stay: true, mood, after: 'idle' }), 500); } }), { threshold: 0.35 }); io2.observe(el); };
    put('rivetMach', 250, 'fuss', 'smug'); put('rivetSign', 160, 'signoff', 'talk');
  }

  // reveal-on-scroll + active chapter (with a sliding underline) + progress bar
  let io = null, spy = null;
  function moveInk(a) { const ink = $('navInk'); if (!ink || !a) return; ink.style.width = a.offsetWidth + 'px'; ink.style.transform = `translateX(${a.offsetLeft}px)`; ink.style.background = getComputedStyle(a).getPropertyValue('--c') || '#16130E'; }
  function watch() {
    if (io) io.disconnect(); if (spy) spy.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
    document.querySelectorAll('.rv').forEach((n) => io.observe(n));
    spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { let on = null; document.querySelectorAll('#track a').forEach((a) => { const hit = a.dataset.t === e.target.id; a.classList.toggle('on', hit); if (hit) on = a; }); if (on) { moveInk(on); on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } } }), { rootMargin: '-25% 0px -65% 0px' });
    document.querySelectorAll('.sec, .band').forEach((n) => spy.observe(n));
    moveInk(document.querySelector('#track a'));
  }
  const setProg = () => { const h = document.documentElement.scrollHeight - innerHeight; $('prog').style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%'; };
  addEventListener('scroll', setProg, { passive: true });

  document.addEventListener('click', (e) => {
    const st = e.target.closest('.story'); if (st && !e.target.closest('a')) st.classList.toggle('open');
    const mh = e.target.closest('.mh'); if (mh) mh.parentElement.classList.toggle('open');
    const ah = e.target.closest('.ah'); if (ah) ah.parentElement.classList.toggle('open');
    const nv = e.target.closest('#track a'); if (nv) { e.preventDefault(); const t = document.getElementById(nv.dataset.t); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  // ---- accessibility: every expandable row is a real keyboard control
  const TOGGLES = '.story > .h, .more-i > .h, .mag > .mh, .art > .ah, .lz-g > .lz-h';
  function enhance() {
    document.querySelectorAll(TOGGLES).forEach((el) => {
      if (!el.hasAttribute('role')) { el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); }
      el.setAttribute('aria-expanded', el.parentElement.classList.contains('open') ? 'true' : 'false');
    });
    const sel = $('dateSel'); if (sel) sel.hidden = sel.options.length < 2;
  }
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][tabindex]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('click', () => setTimeout(enhance, 0));
  let enhT = 0;
  new MutationObserver(() => { clearTimeout(enhT); enhT = setTimeout(enhance, 50); }).observe(document.body, { childList: true, subtree: true });
  enhance();

  // ---- TL;DR layer (summaries written by the local model, cached as static JSON)
  let tlTimer = 0;
  async function loadTldr(date) {
    clearTimeout(tlTimer);
    let d; try { const r = await fetch('tldr.json', { cache: 'no-store' }); if (!r.ok) throw 0; d = await r.json(); } catch (e) { $('lazy').innerHTML = ''; return; }
    const items = d.items || {};
    document.querySelectorAll('[data-tl]').forEach((el) => {
      const it = items[el.dataset.tl]; if (!it) return;
      el.innerHTML = `<b>TL;DR</b>${esc(it.tldr)}${it.why ? `<em>${esc(it.why)}</em>` : ''}`; el.classList.add('on');
    });
    const groups = {};
    Object.entries(items).forEach(([id, it]) => { (groups[it.group] = groups[it.group] || []).push([id, it]); });
    const names = Object.keys(groups);
    const busy = d.status !== 'ready';
    $('lazy').innerHTML = `<div class="tldr"><div class="lbl"><span class="q">TL;DR &mdash; the whole paper, no fluff</span><span>${busy ? `summarizing ${d.done || 0}/${d.total || '?'}…` : (d.built ? 'as of ' + esc(d.built) : '')}</span></div>` +
      (names.length ? names.map((g, gi) => `<div class="lz-g ${gi < 1 ? 'open' : ''}"><div class="lz-h">${esc(g)}<span>${groups[g].length}</span></div>${xp(groups[g].map(([id, it]) =>
        `<div class="lz-i" data-jump="${esc(id)}"><div class="t">${esc(String(it.kind || '').replace(/^(news section|deep dive|magazine feature)[:( ]*/i, '$1 ').slice(0, 40))}</div><div>${esc(it.tldr)}</div>${it.why ? `<small>${esc(it.why)}</small>` : ''}</div>`).join(''))}</div>`).join('')
        : '<div class="note">Summaries are being written &mdash; check back in a few minutes.</div>') + '</div>';
    if (busy) tlTimer = setTimeout(() => loadTldr(date), 25000);
  }
  function jumpTo(id) {
    let el = document.getElementById(id); if (!el) return;
    const mag = el.closest('.mag'); if (mag) mag.classList.add('open');
    if (el.classList.contains('art')) el.classList.add('open');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.addEventListener('click', (e) => {
    const lj = e.target.closest('[data-jump]'); if (lj) jumpTo(lj.dataset.jump);
    const lh = e.target.closest('.lz-h'); if (lh) lh.parentElement.classList.toggle('open');
    const mi = e.target.closest('.more-i'); if (mi && !e.target.closest('a')) mi.classList.toggle('open');
  });

  let archive = [];
  async function load(date) {
    try {
      const d = await (await fetch('edition.json')).json();
      if (!archive.length && d.archive) archive = d.archive;
      render(d, archive); scrollTo(0, 0); if (d.edition) { loadTldr(d.edition.date); mountHero(d.edition.date); }
    } catch (e) { $('paper').innerHTML = '<div class="empty">Couldn’t reach the paper.</div>'; }
  }
  $('dateSel').addEventListener('change', (e) => load(e.target.value));
  load(new URLSearchParams(location.search).get('date'));
})();
</script>
</body>
</html>
